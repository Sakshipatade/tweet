[project]
name = "tweet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sakshipatade", email = "sakshivpatade@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
tweet = "tweet:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

